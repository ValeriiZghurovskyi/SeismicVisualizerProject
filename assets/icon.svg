<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#56d364;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d29922;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#f0b429;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#d29922;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="faultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#da3633;stop-opacity:0.6"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Seismic wave lines (horizons) clipped to circle -->
  <g clip-path="url(#circle-clip)">

    <!-- Horizon 1 (top) - blue -->
    <path d="M 8 88
             C 35 88, 45 72, 68 72
             C 91 72, 98 88, 128 88
             C 158 88, 165 72, 188 72
             C 211 72, 221 88, 248 88"
          fill="none" stroke="url(#waveGrad1)" stroke-width="4" stroke-linecap="round"/>

    <!-- Horizon 1 fill -->
    <path d="M 8 88
             C 35 88, 45 72, 68 72
             C 91 72, 98 88, 128 88
             C 158 88, 165 72, 188 72
             C 211 72, 221 88, 248 88
             L 248 256 L 8 256 Z"
          fill="#1f6feb" fill-opacity="0.05"/>

    <!-- Horizon 2 (middle) - green -->
    <path d="M 8 128
             C 30 128, 42 110, 68 112
             C 94 114, 102 132, 128 130
             C 154 128, 162 112, 188 114
             C 214 116, 222 130, 248 128"
          fill="none" stroke="url(#waveGrad2)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Horizon 2 fill -->
    <path d="M 8 128
             C 30 128, 42 110, 68 112
             C 94 114, 102 132, 128 130
             C 154 128, 162 112, 188 114
             C 214 116, 222 130, 248 128
             L 248 256 L 8 256 Z"
          fill="#3fb950" fill-opacity="0.05"/>

    <!-- Horizon 3 (lower) - yellow/amber -->
    <path d="M 8 170
             C 32 170, 44 154, 70 156
             C 96 158, 104 174, 128 172
             C 152 170, 160 154, 186 156
             C 212 158, 220 172, 248 170"
          fill="none" stroke="url(#waveGrad3)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Fault line (diagonal break) -->
    <line x1="152" y1="55" x2="148" y2="200"
          stroke="url(#faultGrad)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="6,4"/>

    <!-- Fault displacement markers -->
    <circle cx="152" cy="88" r="3" fill="#f85149" fill-opacity="0.9"/>
    <circle cx="150" cy="128" r="3" fill="#f85149" fill-opacity="0.9"/>
    <circle cx="149" cy="170" r="3" fill="#f85149" fill-opacity="0.9"/>

  </g>

  <!-- Subtle grid dots in background -->
  <g fill="#30363d" fill-opacity="0.4">
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="216" cy="40" r="1.5"/>
    <circle cx="40" cy="216" r="1.5"/>
    <circle cx="216" cy="216" r="1.5"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#1f6feb" stroke-width="1" stroke-opacity="0.3"/>
</svg>
