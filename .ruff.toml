line-length = 100
target-version = "py310"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "TID", # flake8-tidy-imports  ← enforces layer boundaries
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[lint.isort]
known-first-party = ["seismic_visualizer"]

[lint.flake8-tidy-imports]
# Absolute imports only — matches CLAUDE.md §7.1
ban-relative-imports = "all"

# Ban Qt/PyVista from every layer except ui/
# Rule TID251 fires for any import listed below.
# ui/ and tests/ are exempted via per-file-ignores.
[lint.flake8-tidy-imports.banned-api]
"PyQt5"     = { msg = "PyQt5 must only be imported in the ui/ layer (see CLAUDE.md §3.2)." }
"pyvista"   = { msg = "pyvista must only be imported in the ui/ layer (see CLAUDE.md §3.2)." }
"pyvistaqt" = { msg = "pyvistaqt must only be imported in the ui/ layer (see CLAUDE.md §3.2)." }

[lint.per-file-ignores]
# ui/ is the only layer allowed to use Qt and PyVista
"src/seismic_visualizer/ui/**/*.py" = ["TID251"]
# tests may import from any layer
"tests/**/*.py" = ["TID251"]

[format]
quote-style = "double"
indent-style = "space"
